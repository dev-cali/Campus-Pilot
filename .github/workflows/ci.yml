name: Campus Pilot CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-demo.txt
            requirements-test.txt

      - name: Install Python & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run Python unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -B -m unittest discover -s tests -v

      - name: Run Backend Tests (Pytest)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest -rs -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend types
        working-directory: frontend
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Run frontend tests
        working-directory: frontend
        run: node --test tests/ai-proxy.test.mjs

      - name: Build frontend
        working-directory: frontend
        env:
          # The static build initializes the browser client during prerender.
          # These placeholders are CI-only and are never used for authentication.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
