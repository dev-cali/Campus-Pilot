name: Campus Pilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-demo.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-demo.txt

      - name: Run Python unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Or if using pinecone explicitly: pip install fastapi uvicorn pinecone-client openai python-dotenv pytest

      - name: Run Backend Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          pytest

      - name: Run frontend tests
        working-directory: frontend
        run: node --test tests/ai-proxy.test.mjs

      - name: Test offline AI workflow
        working-directory: .
        run: |
          python -m pip install -r requirements-demo.txt
          python -B -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend & Build Test
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
